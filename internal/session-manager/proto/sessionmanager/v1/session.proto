syntax = "proto3";

package sessionmanager.v1;

option go_package = "github.com/infodancer/maildancer/internal/session-manager/proto/sessionmanager/v1";

// SessionService handles authentication, session lifecycle, and domain
// validation. Protocol handlers call Login() for SMTP AUTH, ValidateRecipient()
// for RCPT TO checks, and Logout() when the protocol session ends.
service SessionService {
  // Login authenticates a user and establishes a mail-session.
  // If the user already has an active mail-session, it is reused
  // (reference-counted).
  rpc Login(LoginRequest) returns (LoginResponse);

  // Logout ends a protocol handler's use of a session.
  // When the last reference is released, an idle timer starts;
  // if no new Login arrives before it fires, the mail-session
  // process is terminated.
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // ValidateRecipient checks whether a recipient address is deliverable.
  // Used by smtpd at RCPT TO time to determine if the domain is local
  // and whether the user exists.
  rpc ValidateRecipient(ValidateRecipientRequest) returns (ValidateRecipientResponse);

  // CheckPeer reports whether a peer address is currently banned. The protocol
  // dispatchers call it at accept time, before any protocol or TLS work, so a
  // banned peer costs no handler subprocess, no handshake, and no password
  // hash. Ban policy, the Redis client, and the keyspace live here; the
  // daemons only carry an address and obey the verdict.
  rpc CheckPeer(CheckPeerRequest) returns (CheckPeerResponse);

  // ReportPeer records an abuse signal a protocol handler observed that
  // session-manager cannot see on its own -- early talkers, malformed
  // commands, aborted DATA. Authentication failures and recipient probes need
  // no report: Login and ValidateRecipient already run here.
  rpc ReportPeer(ReportPeerRequest) returns (ReportPeerResponse);
}

message LoginRequest {
  // Fully-qualified username (localpart@domain or localpart+ext@domain).
  string username = 1;

  // Password (plaintext over the unix socket / mTLS channel).
  string password = 2;

  // Client's IP address, as seen by the calling daemon. Required for
  // authentication rate limiting: session-manager performs the credential
  // check but has no other way to learn the peer address, and every limiter
  // dimension is keyed on it. An empty value disables rate limiting for the
  // attempt (#206).
  string client_ip = 3;
}

message LoginResponse {
  // Opaque session token. Include as "session-token" gRPC metadata
  // on all subsequent proxied RPCs.
  string session_token = 1;

  // The authenticated mailbox identifier (base@domain, subaddress stripped).
  string mailbox = 2;

  // Subaddress extension (e.g. "ext" from "user+ext@domain"). Empty if none.
  string extension = 3;

  // Per-domain sender rate limit. 0 means no domain-specific limit
  // (use the global default).
  int32 max_sends_per_hour = 4;
}

message LogoutRequest {
  string session_token = 1;
}

message LogoutResponse {}

message ValidateRecipientRequest {
  // Fully-qualified recipient address (user@domain).
  string address = 1;

  // Client's IP address, as seen by the calling daemon. Optional, but without
  // it a recipient dictionary attack cannot be attributed to anyone: an
  // invalid recipient on a local domain is counted as an abuse signal against
  // this address (#206, rule 3).
  string client_ip = 2;
}

message CheckPeerRequest {
  // Peer IP address. IPv6 addresses are normalized to their /64 before
  // lookup, since individual v6 addresses are free to an attacker.
  string ip = 1;
}

message CheckPeerResponse {
  // True when the dispatcher must not serve this peer.
  bool banned = 1;

  // How long to hold a denied connection open before closing it, in
  // milliseconds. Server-driven so the tarpit policy stays in one place.
  // Zero closes immediately.
  int64 tarpit_ms = 2;

  // Coarse policy label for the daemon's logs and metrics. Deliberately not
  // the username, and not which signal fired -- it must not become a
  // side channel.
  string reason = 3;
}

message ReportPeerRequest {
  // Peer IP address.
  string ip = 1;

  // Abuse signal name, e.g. "early_talker", "malformed_command",
  // "data_abort". Unknown signals are counted but never ban on their own.
  string signal = 2;
}

message ReportPeerResponse {}

message ValidateRecipientResponse {
  // True if this server handles the recipient's domain.
  bool domain_is_local = 1;

  // True if the user exists in the domain. Only meaningful when
  // domain_is_local is true.
  bool user_exists = 2;

  // True if unknown-user rejection should be deferred to after DATA
  // (hides address validity). False means reject at RCPT TO.
  bool defer_rejection = 3;
}
